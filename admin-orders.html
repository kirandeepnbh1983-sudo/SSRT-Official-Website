<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Orders | SSRT</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <nav>
        <h1>🚀 SSRT</h1>

        <div>
            <a href="index.html">Home</a>
            <a href="projects.html">Rover Store</a>
            <a href="my-orders.html">My Orders</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>
</header>

<main>

    <section class="hero">
        <p>SSRT ROVER</p>
        <h2>Admin Order Dashboard</h2>
        <p>Update the current demo order.</p>
    </section>

    <section>

        <div class="cards">

            <article class="card">

                <h2>📦 Order Details</h2>

                <p>
                    Order ID:
                    <strong id="orderId">—</strong>
                </p>

                <p>
                    Product:
                    <strong id="product">—</strong>
                </p>

                <p>
                    Version:
                    <strong id="version">—</strong>
                </p>

                <p>
                    Amount:
                    <strong id="amount">—</strong>
                </p>

                <p>
                    Payment:
                    <strong id="payment">—</strong>
                </p>

            </article>

            <article class="card">

                <h2>🚚 Update Status</h2>

                <label for="status">
                    Select New Status
                </label>

                <select id="status">

                    <option value="Order Placed">
                        Order Placed
                    </option>

                    <option value="Confirmed">
                        Confirmed
                    </option>

                    <option value="Processing">
                        Processing
                    </option>

                    <option value="Shipped">
                        Shipped
                    </option>

                    <option value="Out for Delivery">
                        Out for Delivery
                    </option>

                    <option value="Delivered">
                        Delivered
                    </option>

                </select>

                <br><br>

                <button
                    class="btn"
                    id="updateButton"
                    type="button">
                    ✅ Update Status
                </button>

                <p id="message"></p>

            </article>

        </div>

    </section>

    <section id="noOrder" style="display:none;">

        <h2>📭 No Order Found</h2>

        <p>
            Complete a demo order first.
        </p>

    </section>

</main>

<footer>
    <p>© 2026 Space Singh Researcher Team (SSRT)</p>
</footer>


<script>

function getOrder() {

    try {

        return JSON.parse(
            localStorage.getItem("ssrtOrder")
        );

    } catch (error) {

        return null;

    }

}


function showOrder() {

    const order = getOrder();

    if (!order) {

        document.getElementById("noOrder")
            .style.display = "block";

        return;

    }


    document.getElementById("orderId")
        .textContent =
        order.orderId || "—";

    document.getElementById("product")
        .textContent =
        order.product || "—";

    document.getElementById("version")
        .textContent =
        order.version || "—";

    document.getElementById("amount")
        .textContent =
        "₹" +
        Number(order.price || 0)
            .toLocaleString("en-IN");

    document.getElementById("payment")
        .textContent =
        order.paymentStatus || "Pending";


    const currentStatus =
        order.orderStatus || "Order Placed";


    document.getElementById("status").value =
        currentStatus;

}


showOrder();


document
    .getElementById("updateButton")
    .addEventListener("click", function () {

        const order = getOrder();

        if (!order) {

            document.getElementById("message")
                .textContent =
                "No order found.";

            return;

        }


        const newStatus =
            document.getElementById("status").value;


        order.orderStatus =
            newStatus;


        order.lastUpdated =
            new Date().toLocaleString("en-IN");


        localStorage.setItem(
            "ssrtOrder",
            JSON.stringify(order)
        );


        document.getElementById("message")
            .innerHTML =
            "✅ Status updated to <strong>" +
            newStatus +
            "</strong>";


        showOrder();

    });

</script>

</body>
</html>
